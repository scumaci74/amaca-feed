name: Aggiorna Feed Amaca

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Update feed.xml
        shell: bash
        run: |
          set +e

          python update_feed.py
          status=$?

          if [ $status -ne 0 ]; then
            echo "Primo tentativo fallito. Attendo 120 secondi e riprovo..."
            sleep 120
            python update_feed.py
            status=$?
          fi

          if [ $status -ne 0 ]; then
            echo "Secondo tentativo fallito. Attendo 180 secondi e riprovo..."
            sleep 180
            python update_feed.py
            status=$?
          fi

          exit $status

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "Aggiorna feed Amaca"
          git pull --rebase origin main
          git push
